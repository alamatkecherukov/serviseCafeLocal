<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кухня — Ас-Алан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { background: #14302E; color: var(--cream); }
  .k-header {
    display: flex; align-items: center;
    justify-content: space-between; gap: 16px;
    padding: 16px 24px;
    background: rgba(31, 74, 71, 0.85);
    border-bottom: 1px solid var(--emerald-soft);
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(8px);
  }
  .k-logo {
    font-family: var(--font-head);
    font-size: 22px; font-weight: 700; color: var(--cream);
  }
  .k-logo span { color: var(--orange); }
  .k-board {
    padding: 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    max-width: 1600px; margin: 0 auto;
  }
  .k-order {
    background: var(--cream-soft);
    color: var(--dark);
    border-radius: var(--radius);
    padding: 16px;
    border-left: 6px solid var(--orange);
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
    display: flex; flex-direction: column;
  }
  .k-order.cooking { border-left-color: var(--orange); background: #FFF4D8; }
  .k-order.ready { border-left-color: var(--ok); opacity: .85; }
  .k-order__head {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 8px;
  }
  .k-order__table {
    font-family: var(--font-head);
    font-size: 24px; font-weight: 700; color: var(--emerald);
  }
  .k-order__id {
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted);
  }
  .k-order__note {
    background: #FFE9C2; color: #7A4A00;
    padding: 6px 10px; border-radius: 8px;
    font-size: 13px; font-style: italic;
    margin: 6px 0;
  }
  .k-order__items {
    list-style: none; padding: 0; margin: 8px 0;
    flex: 1;
  }
  .k-order__items li {
    padding: 4px 0;
    display: flex; justify-content: space-between;
    border-bottom: 1px dashed rgba(0,0,0,.08);
    font-size: 15px;
  }
  .k-order__items li:last-child { border-bottom: none; }
  .k-order__items .qty { font-weight: 700; color: var(--orange); }
  .k-order__actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .k-order__actions .btn { flex: 1; min-width: 100px; }
  .btn--cancel {
    background: transparent;
    color: var(--danger);
    border: 1.5px solid var(--danger);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    cursor: pointer;
  }
  .btn--cancel:hover { background: var(--danger); color: var(--white); }
  .k-empty {
    text-align: center; color: var(--cream);
    opacity: .5; padding: 80px 20px;
    font-family: var(--font-head); font-size: 24px;
    grid-column: 1 / -1;
  }
  .k-clock {
    font-family: 'Courier New', monospace;
    font-size: 14px; color: var(--cream-soft);
    opacity: .7;
  }

  .k-done-wrap {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 24px 24px;
  }
  .k-done-toggle {
    width: 100%;
    background: rgba(31, 74, 71, 0.7);
    border: 1px solid var(--emerald-soft);
    color: var(--cream);
    padding: 14px 18px;
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    font-family: var(--font-head);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
    transition: background .15s;
  }
  .k-done-toggle:hover { background: rgba(31, 74, 71, 0.95); }
  .k-done-toggle .k-done-count {
    background: var(--orange); color: var(--white);
    padding: 2px 10px; border-radius: 999px;
    font-family: var(--font-body); font-size: 13px;
  }
  .k-done-toggle .k-done-arrow {
    transition: transform .2s;
    font-size: 14px;
  }
  .k-done-wrap.open .k-done-arrow { transform: rotate(180deg); }
  .k-done-grid {
    display: none;
    margin-top: 12px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .k-done-wrap.open .k-done-grid { display: grid; }
  .k-done-item {
    background: rgba(239, 230, 188, 0.85);
    color: var(--dark);
    border-radius: var(--radius-sm);
    padding: 12px;
    border-left: 4px solid var(--ok);
    font-size: 14px;
    opacity: .9;
  }
  .k-done-item__head {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 6px;
  }
  .k-done-item__table {
    font-weight: 700; color: var(--emerald);
    font-family: var(--font-head); font-size: 16px;
  }
  .k-done-item__meta {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .k-done-item ul { list-style: none; padding: 0; margin: 6px 0 0; }
  .k-done-item li { font-size: 13px; padding: 2px 0; color: var(--muted); }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen" style="background:#14302E">
  <div class="login-card">
    <div class="login-card__logo">Ас-Алан<span>.</span></div>
    <div class="login-card__role">Кухня</div>
    <input type="password" class="login-card__pin" id="pin" inputmode="numeric" maxlength="4" placeholder="····">
    <div class="login-card__error" id="loginError"></div>
    <button class="btn btn--primary btn--block" id="loginBtn">Войти</button>
  </div>
</div>

<div id="app" class="hide">
  <div class="k-header">
    <div class="k-logo">Ас-Алан<span>.</span> &nbsp;·&nbsp; Кухня</div>
    <div class="k-clock" id="clock"></div>
    <a href="#" class="btn btn--ghost" style="color:var(--cream)" onclick="logout(event)">Выйти</a>
  </div>

  <div class="k-board" id="board"></div>

  <div class="k-done-wrap" id="doneWrap">
    <button class="k-done-toggle" id="doneToggle">
      <span>Готовые <span class="k-done-count" id="doneCount">0</span></span>
      <span class="k-done-arrow">▼</span>
    </button>
    <div class="k-done-grid" id="doneGrid"></div>
  </div>
</div>

<script>
const PIN_KEY = 'kitchen_pin';
let ws;

function logout(e) {
  e.preventDefault();
  localStorage.removeItem(PIN_KEY);
  location.reload();
}

function tickClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
}
setInterval(tickClock, 1000);
tickClock();

async function doLogin() {
  const pin = document.getElementById('pin').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({role:'kitchen', pin})
    });
    if (r.ok) { localStorage.setItem(PIN_KEY, pin); start(); }
    else err.textContent = 'Неверный PIN';
  } catch { err.textContent = 'Ошибка сети'; }
}

async function start() {
  document.getElementById('loginScreen').classList.add('hide');
  document.getElementById('app').classList.remove('hide');

  document.getElementById('doneToggle').onclick = () => {
    document.getElementById('doneWrap').classList.toggle('open');
  };

  await refresh();
  connectWs();
}

async function refresh() {
  const [news, cooking, ready] = await Promise.all([
    fetch('/api/orders?status=new&shift=current').then(r=>r.json()),
    fetch('/api/orders?status=cooking&shift=current').then(r=>r.json()),
    fetch('/api/orders?status=ready&shift=current').then(r=>r.json()),
  ]);

  const active = [...news, ...cooking];
  const board = document.getElementById('board');
  if (!active.length) {
    board.innerHTML = '<div class="k-empty">Нет активных заказов</div>';
  } else {
    board.innerHTML = '';
    for (const o of active) {
      const el = document.createElement('div');
      el.className = 'k-order ' + o.status;
      el.innerHTML = `
        <div class="k-order__head">
          <div class="k-order__table">Стол ${o.table_number}</div>
          <div class="k-order__id">№${o.order_no ?? o.id} · ${o.source}</div>
        </div>
        ${o.note ? `<div class="k-order__note">${o.note}</div>` : ''}
        <ul class="k-order__items">
          ${o.items.map(i => `
            <li>
              <span>${i.name}${i.note ? ` <em style="color:#7A4A00">(${i.note})</em>` : ''}</span>
              <span class="qty">× ${i.qty}</span>
            </li>`).join('')}
        </ul>
        <div class="k-order__actions">
          ${o.status === 'new'
            ? `<button class="btn btn--primary" onclick="setStatus(${o.id},'cooking')">Начать</button>`
            : `<button class="btn btn--orange" onclick="setStatus(${o.id},'ready')">Готово</button>`}
          <button class="btn--cancel" onclick="cancelOrder(${o.id}, ${o.order_no ?? o.id})">Отменить</button>
        </div>`;
      board.appendChild(el);
    }
  }

  document.getElementById('doneCount').textContent = ready.length;
  const grid = document.getElementById('doneGrid');
  grid.innerHTML = '';
  for (const o of ready) {
    const el = document.createElement('div');
    el.className = 'k-done-item';
    el.innerHTML = `
      <div class="k-done-item__head">
        <div class="k-done-item__table">Стол ${o.table_number}</div>
        <div class="k-done-item__meta">№${o.order_no ?? o.id} · ${o.source}</div>
      </div>
      <ul>${o.items.map(i => `<li>${i.name} × ${i.qty}</li>`).join('')}</ul>
    `;
    grid.appendChild(el);
  }
}

async function setStatus(id, status) {
  await fetch(`/api/orders/${id}/status`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({status})
  });
}

async function cancelOrder(id, no) {
  if (!confirm('Отменить заказ №' + no + '?\nОн не попадёт в сумму смены.')) return;
  await fetch(`/api/orders/${id}/status`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({status:'cancelled'})
  });
}

function connectWs() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'order_new') { beep(); refresh(); }
    else if (msg.type === 'order_updated') refresh();
    else if (msg.type === 'shift_closed') refresh();
  };
  ws.onclose = () => setTimeout(connectWs, 2000);
}

let audioCtx;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start();
    setTimeout(()=>o.stop(), 160);
    setTimeout(()=>{
      const o2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      o2.connect(g2); g2.connect(audioCtx.destination);
      o2.frequency.value = 1180; g2.gain.value = 0.08;
      o2.start(); setTimeout(()=>o2.stop(), 160);
    }, 180);
  } catch {}
}

document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('pin').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

const saved = localStorage.getItem(PIN_KEY);
if (saved) {
  fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({role:'kitchen', pin:saved}) })
    .then(r => r.ok ? start() : localStorage.removeItem(PIN_KEY));
}
</script>
</body>
</html>
